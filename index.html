<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script src="./assets/js/main.js" defer></script>
    <title>Jahir's Workshop</title>
  </head>
  <body>
    <div class="home-container">
      <header class="header">
        <nav class="navbar">
          <a class="logo-area" href="index.html">
            <div>
              <img src="./assets/images/Jahir'sWorkshop.png" alt="logo" />
            </div>
            <div>
              <h3>Jahir's <span>Workshop</span></h3>
            </div>
          </a>
          <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
          <div class="nav home">
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="./others-pages/about.html">About Us</a></li>
              <li><a href="./others-pages/services.html">Services</a></li>
              <li><a href="./others-pages/contact.html">Contacts</a></li>
            </ul>
          </div>
        </nav>
      </header>
      <section class="hero-area">
        <div class="text">
          <h1><span>Hey!</span> Are you looking for a website for you?</h1>
          <h1>Then what are you waiting for?</h1>
          <h1>Choose the right one.</h1>
        </div>
        <div class="check">
          <h2>What type of Developer do you need?</h2>
          <form id="myForm">
            <label>
              <input type="radio" name="developer" value="front-end" />
              Front-End </label
            ><br />
            <label>
              <input type="radio" name="developer" value="back-end" />
              Back-End </label
            ><br />
            <label>
              <input type="radio" name="developer" value="full-stack" />
              Full-Stack </label
            ><br />
            <h2>What kind of WebPage do you need?</h2>
            <label>
              <input type="radio" name="webPage" value="Landing-Page" />
              Landing Page </label
            ><br />
            <label>
              <input type="radio" name="webPage" value="Web-Application" />
              Web Application </label
            ><br />
            <label>
              <input type="radio" name="webPage" value="Static-Web-Page" />
              Static Web Page </label
            ><br />
          </form>
          <div class="mail">
            <label for="email">Email: </label>
            <input type="email" id="email" placeholder="Enter your Email" />
          </div>
        </div>
        <button id="submit" type="button" onclick="getRadioValue()">
          Submit
        </button>
      </section>
    </div>
  </body>
</html>
